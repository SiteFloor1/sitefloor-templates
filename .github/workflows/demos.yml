name: demos

# Publishes every demo to GitHub Pages (demo-hosting.json `base`), built from `production` (the tested code) every day,
# so a demo's dates are always the coming ones (src/demo/dates.js) even when nothing merges for weeks. Also after each
# green run on main, so a merge shows within minutes, and by hand from the Actions tab (Run workflow).
# The case studies go up too (case-studies/, while their public home is still to come on the Sitefloor site).
# Every page is noindex (scripts/pages.js fails the build otherwise): the businesses are fictional. robots.txt allows
# crawling on purpose, so crawlers can read that noindex. GitHub turns scheduled workflows off in a public repo after 60 days with no commits; a merge, or
# "Enable workflow" in the Actions tab, turns it back on.

on:
  schedule:
    - cron: "23 4 * * *" # 04:23 UTC daily, after the nightly check
  workflow_run:
    workflows: [check]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node scripts/pages.js --out _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
