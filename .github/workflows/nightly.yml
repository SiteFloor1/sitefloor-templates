name: nightly

# Every browser test on main once a day, so nothing a narrowed run skipped can slip through (CLAUDE.md, golden rule 2).
# Daily because Actions minutes are free on a public repository. Skipped when main hasn't changed since the last
# green nightly run. Runs check.yml in full; it doesn't promote (pushes to main do that). A failure shows on main's
# commit and GitHub emails the repo admin.
# Run it by hand from the Actions tab (Run workflow) for a full check at any time.

on:
  schedule:
    - cron: "17 2 * * *" # 02:17 UTC daily (free minutes on a public repo)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      run: ${{ steps.last.outputs.run }}
    steps:
      - id: last
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh api "repos/${{ github.repository }}/actions/workflows/nightly.yml/runs?branch=main&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // ""' || true)
          if [ "${{ github.event_name }}" = workflow_dispatch ] || [ "$last" != "${{ github.sha }}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "main is at ${{ github.sha }}; last green nightly at ${last:-none}: full run."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "main unchanged since the last green nightly run: skipped."
          fi

  full:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    uses: ./.github/workflows/check.yml
    # check.yml's jobs declare these; its promote job never runs here (push only).
    permissions:
      contents: write
      pull-requests: read
